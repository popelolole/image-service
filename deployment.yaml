apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: images
  template:
    metadata:
      labels:
        app: images
    spec:
      containers:
        - name: images
          image: docker.io/<dockerhub-username>/image-service:latest
            
        - name: MONGODB_DATABASE
          value: item-db

        - name: KEYCLOAK_URL
          value: http://keycloak-service:8080

        - name: KEYCLOAK_REALM
          value: raven

        - name: KEYCLOAK_CLIENT_ID
          value: image-service

        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: image-service-client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
spec:
  selector:
    app: images
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 31100
  type: NodePort
